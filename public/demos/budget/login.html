<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

<link rel="stylesheet" href="../preview-common.css"></head>
<body data-demo-project="budget" data-demo-page="login.html" class="guest-body">
    
    <div class="guest-shell">
        <header class="guest-topbar">
            <a class="guest-brand" href="./index.html">AI Budget Planner</a>
            <nav class="guest-nav">
                <a href="./login.html" class="active">Login</a>
                <a href="./signup.html" class="">Sign Up</a>
            </nav>
        </header>

        
            
        

        <main class="guest-content">
    
            
<section class="panel guest-panel auth-panel">
    <div class="guest-panel-head">
        <h1>Login</h1>
        <p>Access your budget dashboard and recent insights.</p>
    </div>
    <form method="post" class="form-grid">
        <div>
            <label for="username">Username</label>
            <input id="username" name="username" type="text" placeholder="Enter username" required>
        </div>
        <div>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Enter password" required>
        </div>
        <button class="button" type="submit">Login</button>
    </form>
</section>

        </main>
    </div>

    
<script src="../preview-common.js" defer></script></body>
