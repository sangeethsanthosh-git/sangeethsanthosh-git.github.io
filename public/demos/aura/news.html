e="button" class="suite-tab-btn "><span class="tab-icon">⚙️</span><span>Settings</span></button></nav><div class="top-bar-right-cluster"><div class="engine-badge-pill" title="Local AI Engine: READY"><span class="engine-live-dot" style="background-color: rgb(16, 185, 129);"></span><span class="engine-text">Local (READY)</span></div><button type="button" class="engine-badge-pill companion-toggle-pill " title="Show AURA companion" aria-label="Show AURA companion"><span class="engine-text">AURA</span></button><div class="top-user-pill"><span class="user-avatar-mini">👤</span><span class="user-name-label">Demo visitor</span></div><div class="app-window-controls" aria-label="Window controls"><button type="button" class="app-window-btn" title="Minimize" aria-label="Minimize window">-</button><button type="button" class="app-window-btn" title="Maximize" aria-label="Maximize window">□</button><button type="button" class="app-window-btn app-window-btn--close" title="Close to companion" aria-label="Close main window to companion">x</button></div></div></header><main class="premium-saas-main-canvas"><div class="dedicated-news-page-container" aria-label="Live News Hub"><header class="news-page-masthead"><div class="masthead-headline-group"><div class="masthead-tagline"><span class="masthead-dot"></span><span>Live public RSS feeds / updated daily</span></div><h1 class="masthead-main-title">AURA Live News</h1><p class="masthead-sub-title">Current headlines across world, general, and technology news. Sources open in your browser and are not stored as personal memory.</p></div><form class="news-page-controls-strip"><div class="news-search-box"><span class="search-glyph">Search</span><input class="news-search-input" placeholder="Search today's news..." type="text" value=""></div><div class="news-filter-pills" role="tablist"><button type="button" class="news-page-cat-btn active">All</button><button type="button" class="news-page-cat-btn ">General</button><button type="button" class="ne
