ton" class="suite-tab-btn active"><span class="tab-icon">⚙️</span><span>Settings</span></button></nav><div class="top-bar-right-cluster"><div class="engine-badge-pill" title="Local AI Engine: READY"><span class="engine-live-dot" style="background-color: rgb(16, 185, 129);"></span><span class="engine-text">Local (READY)</span></div><button type="button" class="engine-badge-pill companion-toggle-pill " title="Show AURA companion" aria-label="Show AURA companion"><span class="engine-text">AURA</span></button><div class="top-user-pill"><span class="user-avatar-mini">👤</span><span class="user-name-label">Demo visitor</span></div><div class="app-window-controls" aria-label="Window controls"><button type="button" class="app-window-btn" title="Minimize" aria-label="Minimize window">-</button><button type="button" class="app-window-btn" title="Maximize" aria-label="Maximize window">□</button><button type="button" class="app-window-btn app-window-btn--close" title="Close to companion" aria-label="Close main window to companion">x</button></div></div></header><main class="premium-saas-main-canvas"><div class="settings-desktop-shell" aria-label="AURA Settings"><aside class="settings-desktop-sidebar"><div class="settings-brand-row"><span class="settings-brand-mark">A</span><strong>AURA</strong></div><div class="settings-nav-group"><span>Customize</span><button type="button" class="active"><i>P</i>Profile</button><button type="button" class=""><i>AI</i>AI Engines</button><button type="button" class=""><i>V</i>Voice</button></div><div class="settings-nav-group"><span>Control</span><button type="button" class=""><i>PR</i>Privacy</button><button type="button" class=""><i>IN</i>Integrations</button></div><div class="settings-nav-group"><span>Tools</span><button type="button" class=""><i>UI</i>Appearance</button><button type="button" class=""><i>AD</i>Advanced</button></div></aside><main class="settings-desktop-main"><header class="settings-top-profile"><div class="settings-user-chip"
