e="button" class="suite-tab-btn "><span class="tab-icon">⚙️</span><span>Settings</span></button></nav><div class="top-bar-right-cluster"><div class="engine-badge-pill" title="Local AI Engine: READY"><span class="engine-live-dot" style="background-color: rgb(16, 185, 129);"></span><span class="engine-text">Local (READY)</span></div><button type="button" class="engine-badge-pill companion-toggle-pill " title="Show AURA companion" aria-label="Show AURA companion"><span class="engine-text">AURA</span></button><div class="top-user-pill"><span class="user-avatar-mini">👤</span><span class="user-name-label">Demo visitor</span></div><div class="app-window-controls" aria-label="Window controls"><button type="button" class="app-window-btn" title="Minimize" aria-label="Minimize window">-</button><button type="button" class="app-window-btn" title="Maximize" aria-label="Maximize window">□</button><button type="button" class="app-window-btn app-window-btn--close" title="Close to companion" aria-label="Close main window to companion">x</button></div></div></header><main class="premium-saas-main-canvas"><div class="aura-wallpaper-environment welcome-time-evening" aria-label="AURA Interactive Studio"><div class="scenic-nature-wallpaper-layer"></div><div class="floating-browser-window-frame"><header class="browser-top-window-bar"><div class="browser-tab-cluster"><div class="browser-active-tab"><span class="tab-gem-glyph">✦</span><span class="tab-label-text">AURA Conversation</span><button type="button" class="tab-close-btn" title="New Session">×</button></div><button type="button" class="browser-new-tab-plus" title="New Chat Session">+</button></div><div class="browser-right-actions"><div class="engine-status-pill-mini" title="Local AI Engine: READY"><span class="engine-status-dot-mini" style="background: rgb(16, 185, 129);"></span><span>READY</span></div><div class="browser-user-avatar-circle" title="Alex (Active User)"><span>👤</span></div><button type="button" class="browser-setting
