<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | IntegrityVault</title>
    <link rel="stylesheet" href="./static/css/styles.css">
    
<link rel="stylesheet" href="../preview-common.css"></head>
<body data-demo-project="vault" data-demo-page="login.html">
    <div class="site-bg"></div>
    <div class="page-shell container">
        <header class="app-header">
            <div class="app-title">
                <span class="logo">IV</span>
                <div>
                    <h1>IntegrityVault</h1>
                    <p>File Integrity Verification System</p>
                </div>
            </div>
            
        </header>

        <main class="main-content">
            
                
            

            
<section class="auth-container">
    <div class="card auth-card">
        <form method="post" class="stacked-form auth-form" novalidate>
            <label for="username">Username</label>
            <input id="username" name="username" type="text" maxlength="32" value="" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" required>

            <button type="submit" class="primary-button btn-primary">Login</button>
        </form>

        <p class="inline-note">
            Need an account?
            <a href="./register.html">Create one here</a>.
        </p>
    </div>
</section>

        </main>
    </div>
<script src="../preview-common.js" defer></script></body>
</html>
